spring.application.name=backend

# =========================
# MySQL Configuration
#
# PORT IS 3306, AND THIS MACHINE HAS TWO MYSQL INSTALLS. MySQL 9.7 on 3306
# holds the real `querysense` database; a separate, empty MySQL 8.0 also
# listens on 3307. Pointing at 3307 means the app cannot open the database
# at all, and the usual workaround for that is to start with the `h2`
# profile — at which point /api/query/analyze and /api/query/schema-advisor
# silently return explainFailed=true with a warning that blames the query,
# because H2 does not emit MySQL's EXPLAIN columns. If analysis "stops
# working" for no apparent reason, check the port and the active profile
# before suspecting the analyzer.
#
# Host and port read an environment variable with a default, so a teammate
# whose instance is on 3307 sets DB_PORT=3307 instead of editing (and then
# accidentally committing) this file.
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/querysense
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Server Configuration
# =========================
server.port=8080

# =========================
# MongoDB Configuration
# (Enable later when MongoDB is installed)
# =========================
# spring.data.mongodb.uri=mongodb://localhost:27017/querysense

# =========================
# LLM Fallback — local Ollama
#
# Replaces the previous hosted Gemini 2.5 Flash configuration. There is no
# API key any more: inference runs entirely on this machine, so the fallback
# works with the network unplugged and no secret is needed to run the app.
#
# PREREQUISITES (per developer machine — not committed, ~4.7GB on disk):
#   1. Install Ollama:  https://ollama.com/download
#   2. Pull the model:  ollama pull qwen2.5-coder:7b
# The backend starts fine without either; only Layer 3 fallback generation
# fails, and it reports exactly what to run when it does.
#
# MODEL CHOICE: qwen2.5-coder:7b at q4_K_M is ~4.7GB, which fits an 8GB GPU
# with KV-cache headroom. A 14B at the same quantisation is ~9GB, does not
# fit, and spills to system RAM for roughly a 6x slowdown.
# =========================
ollama.api.url=http://localhost:11434/api/generate
ollama.model=qwen2.5-coder:7b

# How long Ollama keeps the model resident in VRAM after a request. Longer
# than the 5m default so an idle gap mid-demo doesn't force a reload.
ollama.keep-alive=30m

# Hard ceiling on generated tokens — bounds the worst case when the model
# appends commentary despite being told not to. A generated query is
# typically 50-120 tokens.
ollama.num-predict=300

# Pre-loads the model at startup so the first real request doesn't pay the
# 2-4s cold-start cost. Set false to avoid holding ~5GB of VRAM when you
# aren't using the fallback.
ollama.warmup.enabled=true

# =========================
# HTTP client timeouts (RestTemplate — see AppConfig)
# NOTE: the frontend's axios client uses 20s; keep these in mind together.
# =========================
http.client.connect-timeout-ms=3000
http.client.read-timeout-ms=60000
