spring.application.name=backend

# =========================
# MySQL Configuration
#
# PORT IS 3306, AND THIS MACHINE HAS TWO MYSQL INSTALLS. MySQL 9.7 on 3306
# holds the real `querysense` database; a separate, empty MySQL 8.0 also
# listens on 3307. Pointing at 3307 means the app cannot open the database
# at all, and the usual workaround for that is to start with the `h2`
# profile — at which point /api/query/analyze and /api/query/schema-advisor
# silently return explainFailed=true with a warning that blames the query,
# because H2 does not emit MySQL's EXPLAIN columns. If analysis "stops
# working" for no apparent reason, check the port and the active profile
# before suspecting the analyzer.
#
# Host and port read an environment variable with a default, so a teammate
# whose instance is on 3307 sets DB_PORT=3307 instead of editing (and then
# accidentally committing) this file.
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/querysense?rewriteBatchedStatements=true

# rewriteBatchedStatements is what makes schema-upload seeding practical.
# Without it the MySQL driver sends one INSERT per row even inside a JDBC
# batch: seeding 24,000 rows across two tables measured 24.6s here, and a
# ten-table schema at that rate would exceed the frontend's 65s axios
# timeout and fail in the browser while the backend carried on working.
# With it the driver packs each batch into a single multi-row INSERT. It
# changes only how batches are transmitted, never what they do, and has no
# effect on any other query this app runs.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Server Configuration
# =========================
server.port=8080

# =========================
# MongoDB Configuration
# (Enable later when MongoDB is installed)
# =========================
# spring.data.mongodb.uri=mongodb://localhost:27017/querysense

# =========================
# LLM Fallback — local Ollama
#
# Replaces the previous hosted Gemini 2.5 Flash configuration. There is no
# API key any more: inference runs entirely on this machine, so the fallback
# works with the network unplugged and no secret is needed to run the app.
#
# PREREQUISITES (per developer machine — not committed, ~4.7GB on disk):
#   1. Install Ollama:  https://ollama.com/download
#   2. Pull the model:  ollama pull qwen2.5-coder:7b
# The backend starts fine without either; only Layer 3 fallback generation
# fails, and it reports exactly what to run when it does.
#
# MODEL CHOICE: qwen2.5-coder:7b at q4_K_M is ~4.7GB, which fits an 8GB GPU
# with KV-cache headroom. A 14B at the same quantisation is ~9GB, does not
# fit, and spills to system RAM for roughly a 6x slowdown.
# =========================
ollama.api.url=http://localhost:11434/api/generate
ollama.model=qwen2.5-coder:7b

# How long Ollama keeps the model resident in VRAM after a request. Longer
# than the 5m default so an idle gap mid-demo doesn't force a reload.
ollama.keep-alive=30m

# Hard ceiling on generated tokens — bounds the worst case when the model
# appends commentary despite being told not to. A generated query is
# typically 50-120 tokens.
ollama.num-predict=300

# Pre-loads the model at startup so the first real request doesn't pay the
# 2-4s cold-start cost. Set false to avoid holding ~5GB of VRAM when you
# aren't using the fallback.
ollama.warmup.enabled=true

# =========================
# HTTP client timeouts (RestTemplate — see AppConfig)
# NOTE: the frontend's axios client uses 20s; keep these in mind together.
# =========================
http.client.connect-timeout-ms=3000
http.client.read-timeout-ms=60000

# =========================
# Schema upload
#
# Uploaded DDL is provisioned into a database of its OWN, never into the
# connected `querysense` database — so the built-in demo schema and
# query_history are never at risk, and "reset to built-in" is a reference
# swap with nothing to undo in MySQL at all.
#
# WHY THE TABLES ARE SEEDED AT ALL: EXPLAIN needs statistics, not just
# structure. On an empty table MySQL reports rows=1, filtered=100.00 for
# every query — the access path is right and the magnitude is meaningless,
# so every module downstream of EXPLAIN produces output that looks fine
# and says nothing. Section 7 of PROJECT.md records the measurement.
#
# WHY 12000, MEASURED RATHER THAN GUESSED: the domain and resource modules
# each have their own row-count threshold, and a scan below one of them is
# reported as "the estimated row count is low, so the performance impact is
# likely minor" - the finding without the consequence. The thresholds are
# TRANSACTIONAL 100, ECOMMERCE 1000, ResourceConsciousService 5000 and
# ANALYTICAL 10000, all exclusive. An earlier default of 500 was verified
# live to clear only TRANSACTIONAL: the same query returned a CRITICAL
# finding under that profile and "impact is likely minor" under ECOMMERCE.
# 12000 clears all four, so an uploaded schema exercises every branch of
# the analysis engine rather than one. Seeding cost is roughly linear -
# 1000 rows took 1.3s end to end on the dev machine.
#
# The generated data is REPRODUCIBLE: `seed` fixes the RNG, so the same
# file uploaded twice produces the same row estimates on any machine.
#
# REQUIRES: the connecting account needs CREATE on the upload catalog.
# NOT AVAILABLE under the h2 profile — upload refuses rather than half-run.
# =========================
querysense.schema.upload.catalog=querysense_uploads
querysense.schema.upload.max-tables=40
querysense.schema.upload.seed-rows=12000
querysense.schema.upload.seed=20260910
querysense.schema.upload.max-file-bytes=2097152
