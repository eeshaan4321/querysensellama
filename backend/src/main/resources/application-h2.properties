# =====================================================================
# Spring profile: h2  —  OPTIONAL, for testing query generation only
#
# Activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# WHY THIS PROFILE EXISTS:
# Query generation (/api/query/generate) doesn't actually need MySQL for
# anything MySQL-specific — it needs *a* database for the history/cache
# table and for SchemaMetadataService's live city lookup. But Hibernate
# needs a live connection at startup, so with no database at all the whole
# Spring context fails to start and nothing can be tested. This profile
# swaps in an in-memory H2 so the NL->SQL pipeline can be exercised on a
# machine where MySQL isn't set up yet.
#
# THIS IS NOT A SUBSTITUTE FOR MYSQL. The Query Analysis Engine reads
# MySQL's specific EXPLAIN columns (type / key / rows / Extra), which H2
# does not produce in any comparable form, so /api/query/analyze and
# /api/query/schema-advisor cannot work under this profile. Neither can
# the before/after index proof-of-concept. Those need the real thing.
#
# The default profile (application.properties) is untouched and still
# points at MySQL on 3307.
# =====================================================================

# MODE=MySQL makes H2 accept MySQL-flavoured SQL and mimic its behaviour.
# DB_CLOSE_DELAY=-1 keeps the in-memory database alive for the lifetime of
# the JVM rather than dropping it when the last connection closes.
spring.datasource.url=jdbc:h2:mem:querysense;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# The base config turns SQL logging on, which drowns the console once every
# generate call writes a history row. Off here so the interesting output is
# actually readable.
spring.jpa.show-sql=false

# Hibernate creates query_history (the only JPA entity) first; then the
# scripts below create and seed customers/orders, which are NOT entities —
# nothing in this app writes to them, they exist so the rule engine's
# live-data safety net has real values to read.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:h2/schema.sql
spring.sql.init.data-locations=classpath:h2/data.sql

# Browse the in-memory database at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:querysense   User: sa   Password: (blank)
# Useful for watching query_history fill up as you test.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
